name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El proyecto no incluye gradlew, así que se instala Gradle 8.7
      # (la misma versión de gradle-wrapper.properties).
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroTimer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
